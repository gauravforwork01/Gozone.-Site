<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>gozone.Site – AI Image Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#020617;
  color:#fff;
  text-align:center;
}
h1{color:#38bdf8;margin-top:30px}
.box{
  max-width:420px;
  margin:40px auto;
  padding:25px;
  background:#020617;
  border-radius:14px;
  box-shadow:0 0 20px rgba(0,0,0,.7);
}
input{
  width:90%;
  padding:12px;
  font-size:16px;
  border-radius:8px;
  border:none;
}
button{
  margin-top:15px;
  padding:12px 25px;
  border:none;
  border-radius:8px;
  background:#38bdf8;
  color:#020617;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
#loader{
  display:none;
  margin-top:20px;
}
.spinner{
  width:40px;
  height:40px;
  border:4px solid #1e293b;
  border-top:4px solid #38bdf8;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:0 auto;
}
@keyframes spin{
  0%{transform:rotate(0deg)}
  100%{transform:rotate(360deg)}
}
#result{
  display:none;
  margin-top:25px;
}
a{
  display:inline-block;
  margin-top:10px;
  padding:12px 20px;
  background:#22c55e;
  color:#020617;
  text-decoration:none;
  border-radius:8px;
  font-weight:bold;
}
</style>
</head>

<body>

<h1>gozone.Site</h1>
<p>AI Text to Image Generator</p>

<div class="box">
  <input id="prompt" placeholder="dog, cat, ai robot">
  <br>
  <button onclick="generate()">Generate</button>

  <!-- Processing -->
  <div id="loader">
    <p>Processing...</p>
    <div class="spinner"></div>
  </div>

  <!-- Result -->
  <div id="result">
    <p>Your image is ready 👇</p>
    <a id="imageBtn" target="_blank">Preview / Download</a>
  </div>
</div>

<script>
function generate(){
  const text=document.getElementById("prompt").value.trim();
  if(!text){
    alert("Enter something like dog");
    return;
  }

  document.getElementById("loader").style.display="block";
  document.getElementById("result").style.display="none";

  fetch(
    "https://all-type-photo-gen.onrender.com/api/generate?img="
    + encodeURIComponent(text)
  )
  .then(res=>res.json())
  .then(data=>{
    document.getElementById("loader").style.display="none";

    if(data.status==="success" && data.image_link){
      const btn=document.getElementById("imageBtn");
      btn.href=data.image_link;
      document.getElementById("result").style.display="block";
    }else{
      alert("Image generation failed");
    }
  })
  .catch(()=>{
    document.getElementById("loader").style.display="none";
    alert("API error");
  });
}
</script>

</body>
</html>
