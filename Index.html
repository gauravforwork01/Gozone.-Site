<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Image Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  background:#0f172a;
  color:white;
  font-family:Arial;
  text-align:center;
  padding:40px;
}
input{
  width:80%;
  padding:12px;
  font-size:16px;
  border-radius:8px;
  border:none;
}
button{
  margin-top:15px;
  padding:12px 25px;
  font-size:16px;
  border:none;
  border-radius:8px;
  background:#38bdf8;
  color:black;
  cursor:pointer;
}
#loader{
  display:none;
  margin-top:20px;
}
.spinner{
  width:40px;
  height:40px;
  border:4px solid #1e293b;
  border-top:4px solid #38bdf8;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:auto;
}
@keyframes spin{
  0%{transform:rotate(0deg)}
  100%{transform:rotate(360deg)}
}
#result{
  display:none;
  margin-top:25px;
}
a{
  display:inline-block;
  padding:12px 20px;
  background:#22c55e;
  color:black;
  text-decoration:none;
  border-radius:8px;
  font-weight:bold;
}
</style>
</head>

<body>

<h2>AI Image Generator</h2>

<input id="text" placeholder="dog, cat, car">
<br>
<button onclick="generate()">Generate Image</button>

<div id="loader">
  <p>Processing...</p>
  <div class="spinner"></div>
</div>

<div id="result">
  <p>Your image is ready 👇</p>
  <a id="downloadBtn" target="_blank">Preview / Download</a>
</div>

<script>
function generate(){
  const word = document.getElementById("text").value.trim();
  if(!word){
    alert("Kuch likh bhai 😅");
    return;
  }

  document.getElementById("loader").style.display="block";
  document.getElementById("result").style.display="none";

  fetch("https://all-type-photo-gen.onrender.com/api/generate?img=" + encodeURIComponent(word))
    .then(res => res.json())
    .then(data => {
      document.getElementById("loader").style.display="none";

      if(data.status === "success" && data.image_link){
        document.getElementById("downloadBtn").href = data.image_link;
        document.getElementById("result").style.display="block";
      } else {
        alert("Image generate nahi hui");
      }
    })
    .catch(() => {
      document.getElementById("loader").style.display="none";
      alert("API error (browser block kar raha hai)");
    });
}
</script>

</body>
</html>
