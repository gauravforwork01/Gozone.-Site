
<!DOCTYPE html>
<html>
<body style="background:#0f172a;color:white;text-align:center;padding:40px">

<h2>AI Image Generator</h2>

<input id="txt" placeholder="dog, cat, car" style="padding:10px;width:80%">
<br><br>

<button onclick="go()" style="padding:12px 20px">Generate Image</button>

<script>
function go(){
  const t = document.getElementById("txt").value.trim();
  if(!t){ alert("kuch likh bhai"); return; }

  // DIRECT OPEN API
  window.open(
    "https://all-type-photo-gen.onrender.com/api/generate?img=" 
    + encodeURIComponent(t),
    "_blank"
  );
}
</script>

</body>
</html>
