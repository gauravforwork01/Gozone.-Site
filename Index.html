<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>gozone.Site | AI Image Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #ffffff;
      text-align: center;
    }

    header {
      padding: 20px;
      background: #020617;
      box-shadow: 0 0 10px rgba(0,0,0,0.6);
    }

    h1 {
      margin: 5px 0;
      color: #38bdf8;
    }

    p {
      color: #cbd5f5;
    }

    .box {
      margin: 30px auto;
      max-width: 400px;
      background: #020617;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.7);
    }

    input {
      width: 90%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      outline: none;
      margin-bottom: 10px;
      font-size: 16px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #38bdf8;
      color: #020617;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #0ea5e9;
    }

    img {
      margin-top: 20px;
      max-width: 100%;
      border-radius: 10px;
      display: none;
    }

    footer {
      margin-top: 40px;
      padding: 15px;
      font-size: 14px;
      color: #94a3b8;
    }

    a {
      color: #38bdf8;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>
  <h1>gozone.Site</h1>
  <p>AI Text to Image Generator</p>
</header>

<div class="box">
  <h3>Enter any text 👇</h3>
  <input type="text" id="prompt" placeholder="DOG, CAT, AI ROBOT...">
  <br>
  <button onclick="generate()">Generate Image</button>

  <img id="result">
</div>

<footer>
  <p>
    Created by <b>Gaurav Kumar (Gaurav Rockn 😁)</b><br>
    Instagram: 
    <a href="https://instagram.com/gozone.Site" target="_blank">
      @gozone.Site
    </a>
  </p>
</footer>

<script>
  function generate() {
    let text = document.getElementById("prompt").value;
    let img = document.getElementById("result");

    if (text.trim() === "") {
      alert("Please enter some text");
      return;
    }

    img.style.display = "block";
    img.src =
      "https://all-type-photo-gen.onrender.com/api/generate?img=" +
      encodeURIComponent(text);
  }
</script>

</body>
</html>
